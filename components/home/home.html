<main>
    <div class="album py-4 bg-body-tertiary">
        <div class="container-fluid px-4">

            <div class="row">
                
                <div class="col-md-8">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0">Select Products</h4>
                        <div class="input-group" style="max-width: 300px;">
                            <input type="text" id="pos-search" class="form-control" placeholder="Search..."
                                onkeyup="searchProducts()">
                            <span class="input-group-text bg-dark text-white border-dark">🔍</span>
                        </div>
                    </div>

                    <div class="row row-cols-1 row-cols-md-3 g-3" id="product-list"
                        style="max-height: 60vh; overflow-y: auto; overflow-x: hidden;">
                        </div>
                    
                    <div id="pagination-controls" class="mt-3"></div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow-sm sticky-top" style="top: 10px;">
                        <div class="card-header bg-dark text-white">
                            <h5 class="mb-0">Current Order</h5>
                        </div>
                        <div class="card-body p-2" style="height: 45vh; overflow-y: auto;" id="cart-items">
                            <p class="text-muted text-center mt-5">No items in cart</p>
                        </div>
                        <div class="card-footer bg-white">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="mb-0">Total:</h5>
                                <h4 class="mb-0 text-success">$<span id="cart-total">0.00</span></h4>
                            </div>
                            <button class="btn btn-dark w-100 py-2 fs-5" onclick="processPayment()">Pay & Print Receipt</button>
                        </div>
                    </div>
                </div>
                
            </div> </div>
    </div>
</main>
