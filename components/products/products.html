<main>
    <div class="album py-4 bg-body-tertiary">
        <div class="container-fluid px-4">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">📦 Manage Inventory</h3>
            </div>

            <div class="card shadow-sm mb-5">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="mb-0">Add New Product</h5>
                </div>
                <div class="card-body p-4">
                    <form id="add-product-form" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Product Name</label>
                            <input type="text" class="form-control" id="product-name" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Price ($)</label>
                            <input type="number" class="form-control" id="product-price" step="0.01" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Category</label>
                            <input type="text" class="form-control" id="product-category" placeholder="e.g. TOPS" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Product Image</label>
                            <input type="file" class="form-control" id="product-image" accept="image/*">
                            <div class="mt-2">
                                <img id="image-preview" src="" style="max-height: 100px; display: none;" class="img-thumbnail">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Size</label>
                            <input type="text" class="form-control" id="product-size" placeholder="M">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Color</label>
                            <input type="text" class="form-control" id="product-color" placeholder="Black">
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-dark px-4 py-2">Add to Inventory</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="admin-table-container" class="mb-4"></div>
            
            <div id="admin-pagination-controls" class="d-flex justify-content-center pb-5"></div>

        </div>
    </div>
</main>
