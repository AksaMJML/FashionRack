<main>
    <div class="album py-3 bg-body-tertiary" style="height: 100vh; overflow: hidden;">
        <div class="container-fluid px-3">
            
            <h4 class="mb-3">📦 Manage Products</h4>

            <div class="row">
                
                <div class="col-md-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-dark text-white p-2">
                            <h6 class="mb-0">Add / Edit Product</h6>
                        </div>
                        <div class="card-body p-3" style="max-height: 75vh; overflow-y: auto;">
                            <form id="add-product-form" class="row g-2">
                                <div class="col-12">
                                    <label class="form-label mb-0 small fw-bold">Product Name</label>
                                    <input type="text" class="form-control form-control-sm" id="product-name" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label mb-0 small fw-bold">Price ($)</label>
                                    <input type="number" class="form-control form-control-sm" id="product-price" step="0.01" min="0.01" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label mb-0 small fw-bold">Category</label>
                                    <input type="text" class="form-control form-control-sm" id="product-category" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label mb-0 small fw-bold">Product Image</label>
                                    <input type="file" class="form-control form-control-sm" id="product-image" accept="image/*">
                                    <div class="mt-1">
                                        <img id="image-preview" src="" style="max-height: 60px; display: none;" class="border rounded">
                                    </div>
                                </div>
                                <div class="col-6">
                                    <label class="form-label mb-0 small fw-bold">Size (opt)</label>
                                    <input type="text" class="form-control form-control-sm" id="product-size">
                                </div>
                                <div class="col-6">
                                    <label class="form-label mb-0 small fw-bold">Color (opt)</label>
                                    <input type="text" class="form-control form-control-sm" id="product-color">
                                </div>
                                <div class="col-12 mt-3">
                                    <button type="submit" class="btn btn-dark btn-sm w-100">Save Product</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div style="height: 80vh; overflow-y: auto; overflow-x: hidden; padding-right: 5px;">
                        
                        <div id="admin-table-container"></div>
                        
                        <div id="admin-pagination-controls" class="mt-3 mb-4"></div>
                        
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>
