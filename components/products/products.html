<div class="container-fluid" style="height: 100vh; overflow-y: auto; padding-bottom: 50px;">
    <div class="card shadow-sm mb-4 mt-3">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Add New Product </h5>
        </div>
        <div class="card-body">
            <form id="add-product-form" class="row g-3">
                <div class="col-md-6">
                    <label for="product-name" class="form-label">Product Name</label>
                    <input type="text" class="form-control" id="product-name" required>
                </div>
                <div class="col-md-3">
                    <label for="product-price" class="form-label">Price</label>
                    <input type="number" class="form-control" id="product-price" step="0.01" min="0.01" required>
                </div>
                <div class="col-md-3">
                    <label for="product-category" class="form-label">Category</label>
                    <input type="text" class="form-control" id="product-category" placeholder="TOPS" required>
                </div>
                <div class="col-md-6">
                    <label for="product-image" class="form-label">Product Image</label>
                    <input type="file" class="form-control" id="product-image" accept="image/*">

                    <div class="mt-2">
                        <img id="image-preview" src="" alt="Current Image" style="max-height: 80px; display: none;"
                            class="border rounded">
                    </div>
                </div>
                <div class="col-md-3">
                    <label for="product-size" class="form-label">Size (optional)</label>
                    <input type="text" class="form-control" id="product-size" placeholder="M">
                </div>
                <div class="col-md-3">
                    <label for="product-color" class="form-label">Color (optional)</label>
                    <input type="text" class="form-control" id="product-color" placeholder="Black">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-dark">Add Product</button>
                </div>
            </form>
        </div>
    </div>

    <div id="admin-table-container"></div>
    <div id="admin-pagination-controls" class="mt-3 mb-5"></div>
</div>
